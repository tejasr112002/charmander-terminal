# Fly.io config for the mock trading terminal.
# Deploy with: fly launch --copy-config --no-deploy && fly deploy
app = "charmander-terminal"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3100"
  NODE_ENV = "production"

[http_service]
  internal_port = 3100
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
